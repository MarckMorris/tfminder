# Copy to .github/workflows/ in your infrastructure repo.
# Posts tfminder's verdict on every pull request and fails the check when policy denies the plan.
name: tfminder

on:
  pull_request:
    paths: ["infra/**", ".tfminder.yaml"]

permissions:
  contents: read
  id-token: write        # Workload Identity Federation to GCP
  pull-requests: write
  security-events: write   # SARIF upload

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.PLAN_SA }}        # read-only: roles/viewer + state bucket reader
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: Plan
        working-directory: infra
        run: |
          terraform init -input=false
          terraform plan -input=false -out=tfplan
          terraform show -json tfplan > plan.json
      - uses: MarckMorris/tfminder@v0
        with:
          plan: infra/plan.json
          config: .tfminder.yaml
          workspace: prod
          sarif-location: infra/main.tf

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
        mcp: ["mcp<2", "mcp>=2"]
        exclude:
          - python: "3.10"
            mcp: "mcp>=2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_wrapper: false
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install "git+https://github.com/MarckMorris/pyrrho@v0.2.1" "git+https://github.com/MarckMorris/strayform"
          pip install "${{ matrix.mcp }}" -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test (unit + end to end against real OpenTofu)
        run: pytest -v

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: Install
        run: |
          pip install "git+https://github.com/MarckMorris/pyrrho@v0.2.1"
          pip install -e ".[dev]"
      - name: End to end against real Terraform
        run: pytest -v tests/test_e2e.py
